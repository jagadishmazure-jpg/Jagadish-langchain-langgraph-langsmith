[project]
name = "lcstack"
version = "0.1.0"
description = "LangChain, LangGraph and LangSmith end to end: 25 runnable client scenarios (one per section of a LangChain 1.x cheat sheet) and a multi-agent support capstone with RAG, MCP, HITL, persistence, streaming, tracing and evaluation. Offline and deterministic by default."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
# Direct dependencies are pinned to the versions the tests ran with; requirements.lock pins the full tree.
dependencies = [
  "langchain==1.4.4",
  "langchain-core==1.6.9",
  "langgraph==1.2.14",
  "langsmith==0.14.7",
  "langchain-text-splitters==1.1.3",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary,pool]==3.3.6",
  "langchain-mcp-adapters==0.3.2",
  "mcp==2.3.0",
  "langchain-classic==1.0.8",  # LEGACY: only scenario 24 (migration) imports it
  "deepagents==0.7.23",
  "langchain-openai==1.7.0",
  "numpy==2.5.4",  # InMemoryVectorStore cosine similarity
  "pydantic>=2.14.0,<3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0", "langgraph-cli[inmem]==0.4.33"]
azure = ["azure-identity==1.26.0"]
server = ["langgraph-cli[inmem]==0.4.33"]

[project.scripts]
lcstack = "lcstack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcstack"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::langsmith.utils.LangSmithWarning"]
markers = ["postgres: needs DATABASE_URL pointing at a Postgres server (CI provides one)"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
