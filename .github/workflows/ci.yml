# Offline CI: lint, tests, the regression gate (offline LangSmith evals), doc drift, the overlap-free
# import lint, a PostgresSaver test against a service container, a local Agent Server smoke test,
# Bicep build, SBOM and a secret scan. No API keys and no cloud. Actions are pinned to commit SHAs.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  LANGSMITH_TRACING: "false"
  LCSTACK_MODEL: scripted
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Pre-1.0 import lint (everything except the labelled legacy module)
        run: lcstack lint-imports src/lcstack/core src/lcstack/capstone src/lcstack/scenarios src/lcstack/cli.py scripts tests
      - name: Tests (offline, scripted model, network blocked)
        run: pytest -q
      - name: Regression gate (evaluation thresholds, guardrail invariants, all 25 scenarios)
        run: |
          mkdir -p evidence
          lcstack gate | tee evidence/gate.txt
      - name: Doc outputs and code excerpts match a fresh run
        run: python scripts/render_docs.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: gate-report, path: evidence/gate.txt, if-no-files-found: ignore }

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lcstack
          POSTGRES_PASSWORD: lcstack-ci-only
          POSTGRES_DB: checkpoints
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lcstack" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lcstack:lcstack-ci-only@localhost:5432/checkpoints?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: PostgresSaver round trip (scenario 15)
        run: pytest -q -m postgres
      - name: Scenario 15 output with Postgres
        run: lcstack run 15

  agent-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Local Agent Server (langgraph dev) driven by the SDK
        run: python scripts/agent_server_smoke.py

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bicep CLI (pinned)
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep && bicep --version
      - name: bicep build (linter runs as part of build; warnings fail the job)
        run: |
          bicep build infra/bicep/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          cat bicep.log
          if grep -q "Warning" bicep.log; then exit 1; fi

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
